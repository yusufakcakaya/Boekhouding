<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wachtwoord Vergeten</title>

    <link rel="stylesheet" href="/static/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .forgot-box {
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            text-align: center;
        }

        .forgot-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .forgot-sub {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .forgot-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .forgot-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg,#ff7bb2,#ff9a7f);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-btn:hover {
            opacity: 0.9;
        }

        .back-login {
            margin-top: 15px;
            display: block;
            color: #4a72ff;
            text-decoration: none;
            font-weight: 600;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f6f7fb;
        }
    </style>
</head>

<body>

<div class="forgot-box">

    <div class="forgot-title">Wachtwoord Vergeten</div>
    <div class="forgot-sub">Voer je e-mailadres in om een resetlink te ontvangen.</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, msg in messages %}
            <div class="alert">{{ msg }}</div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('forgot_password') }}">
        <input type="email" name="email" placeholder="E-mail adres" class="forgot-input" required>

        <button type="submit" class="forgot-btn">Reset link sturen</button>
    </form>

    <a href="{{ url_for('login') }}" class="back-login">Terug naar inloggen</a>
</div>

</body>
</html>
